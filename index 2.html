<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alta PS — receitas e orientações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#101A2B; --muted:#5A6676; --faint:#8A95A5; --line:#DCE2EA; --line-2:#E8ECF1;
  --accent:#1E4FD0; --accent-ink:#FFFFFF; --accent-weak:#E7EEFD; --accent-line:#BBCCF5;
  --warn:#8A4B00; --warn-weak:#FDF1DD; --danger:#A6261A; --danger-weak:#FCE9E6; --ok:#0B6B4C; --ok-weak:#E2F4EC;
  --paper:#FFFFFF; --paper-rule:#EEF2F8; --shadow:0 1px 2px rgba(16,26,43,.06),0 8px 24px rgba(16,26,43,.06);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C111B; --surface:#141B27; --surface-2:#19212F; --ink:#E6EBF2; --muted:#9AA6B6; --faint:#6E7A8B; --line:#263142; --line-2:#1F2836;
    --accent:#7FA2FF; --accent-ink:#0C111B; --accent-weak:#1A2643; --accent-line:#2F4579;
    --warn:#F2B866; --warn-weak:#2E2414; --danger:#FF8F82; --danger-weak:#36191A; --ok:#5ED3A4; --ok-weak:#123026;
    --paper:#10161F; --paper-rule:#18202C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#141B27; --surface-2:#19212F; --ink:#E6EBF2; --muted:#9AA6B6; --faint:#6E7A8B; --line:#263142; --line-2:#1F2836;
  --accent:#7FA2FF; --accent-ink:#0C111B; --accent-weak:#1A2643; --accent-line:#2F4579;
  --warn:#F2B866; --warn-weak:#2E2414; --danger:#FF8F82; --danger-weak:#36191A; --ok:#5ED3A4; --ok-weak:#123026;
  --paper:#10161F; --paper-rule:#18202C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.shell{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.rx-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;line-height:1}
.brand b{font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;display:block}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 44px 0 42px;font-size:16px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:13px;top:12px;width:20px;height:20px;color:var(--faint)}
.search kbd{position:absolute;right:10px;top:10px}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--surface)}
.top-tools{display:flex;align-items:center;gap:8px;flex:none}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);user-select:none;cursor:pointer;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.switch input{appearance:none;width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(12px)}

main.cols{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) minmax(400px,480px);min-height:0}
.col{min-height:0;overflow:auto}
.col-list{border-right:1px solid var(--line);background:var(--surface)}
.col-detail{padding:28px 32px 120px}
.col-out{border-left:1px solid var(--line);background:var(--surface-2);padding:20px 20px 40px}

/* List */
.list{padding:10px 10px 40px}
.list h3{font-size:12px;font-weight:600;color:var(--faint);margin:18px 10px 6px;letter-spacing:.01em}
.list h3:first-child{margin-top:6px}
.li{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;color:var(--ink);font-size:14.5px;line-height:1.3;position:relative}
.li:hover{background:var(--surface-2)}
.li .cid{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.li[aria-current="true"]{background:var(--accent-weak);color:var(--ink)}
.li[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.li.kb{box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.li .star{color:var(--warn);font-size:12px}
.empty-list{padding:24px 14px;color:var(--muted);font-size:14px}

/* Detail */
.back{display:none}
.d-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.d-head h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:650;flex:1;text-wrap:balance}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--ink)}
.iconbtn[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-weak)}
.d-sys{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.cids{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.cidchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;display:flex;gap:7px;align-items:baseline}
.cidchip b{font-variant-numeric:tabular-nums}
.cidchip span{color:var(--muted)}
.cidchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.banner{border-radius:12px;padding:11px 14px;font-size:13.5px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.banner.fix{background:var(--warn-weak);color:var(--warn)}
.banner.added{background:var(--danger-weak);color:var(--danger)}
.banner svg{flex:none;width:16px;height:16px;margin-top:2px}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:22px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

section.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.blk-h h2{font-size:15px;margin:0;font-weight:650}
.blk-h .count{font-size:12.5px;color:var(--muted)}
.blk-h .sp{flex:1}
.textbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 6px;border-radius:6px}
.textbtn:hover{background:var(--accent-weak)}

.rx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 18px;border-top:1px solid var(--line-2);cursor:pointer}
.rx:first-child{border-top:0}
.rx.off .rx-main{opacity:.55}
.cb{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);margin:1px 0 0;display:grid;place-items:center;background:var(--surface);cursor:pointer;transition:background .12s,border-color .12s}
.cb::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{opacity:1}
.rx-name{font-weight:600;font-size:15px;line-height:1.3}
.rx-pos{color:var(--muted);font-size:14px;margin-top:3px}
.tags{display:inline-flex;gap:5px;flex-wrap:wrap;margin-left:6px;vertical-align:2px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.atb{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.tag.ce{background:var(--danger-weak);color:var(--danger);border-color:transparent}
.tag.prn{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.rx-note{font-size:12.5px;margin-top:6px;color:var(--warn)}
.rx-ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;height:34px}
.step button{border:0;background:none;width:32px;height:100%;font-size:17px;color:var(--muted);line-height:1}
.step button:hover{background:var(--surface-2);color:var(--ink)}
.step output{min-width:78px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums;padding:0 2px}
.step output b{font-weight:650}
.alt-h{padding:10px 18px;background:var(--surface-2);font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2);font-weight:600}

.free{display:grid;grid-template-columns:1.4fr .8fr auto;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.free input,.free select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:14px;min-width:0}
.free .wide{grid-column:1 / -1}
.free .row2{display:grid;grid-template-columns:auto 1fr auto;gap:8px;grid-column:1 / -1}
.btn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn svg{width:16px;height:16px}

.chk-list{list-style:none;margin:0;padding:6px 0}
.chk-list li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:9px 18px;cursor:pointer;font-size:14.5px}
.chk-list li.off span{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.sub-h{padding:12px 18px 4px;font-size:13px;font-weight:650;color:var(--danger)}
.addline{display:flex;gap:8px;padding:8px 18px 14px}
.addline input{flex:1;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:0 10px;font-size:14px;min-width:0}

.plain{list-style:none;margin:0;padding:8px 0}
.plain li{padding:8px 18px 8px 38px;position:relative;font-size:14.5px}
.plain li::before{content:"";position:absolute;left:20px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.plain.num{counter-reset:n}
.plain.num li::before{counter-increment:n;content:counter(n);width:auto;height:auto;background:none;top:8px;left:18px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:600}
.blk-note{padding:0 18px 14px;color:var(--muted);font-size:13px}
.tpl-area{width:100%;min-height:340px;border:0;border-top:1px solid var(--line-2);padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--paper);resize:vertical;outline:none}

/* Welcome */
.welcome{max-width:560px;margin:8vh auto 0}
.welcome h1{font-size:32px;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0 0 22px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.keys{margin-top:28px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px;color:var(--muted);align-items:center}

/* Output */
.out-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.out-tabs button{border:0;background:none;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.out-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.paper-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line-2)}
.paper-h h4{margin:0;font-size:13px;font-weight:650;flex:1}
.paper-h h4 small{display:block;font-weight:500;color:var(--danger);font-size:12px}
.paper pre{margin:0;padding:16px;font-family:var(--mono);font-size:12.2px;line-height:1.65;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.out-empty{color:var(--muted);font-size:14px;padding:24px 4px}
.out-actions{display:flex;flex-direction:column;gap:8px}
.out-actions .btn{height:46px;font-size:15px}
.hint{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.7}
.disclaimer{font-size:12px;color:var(--faint);margin-top:18px;border-top:1px solid var(--line);padding-top:12px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mbar{display:none}

/* Medium: hide output column, show below */
@media (max-width:1180px){
  main.cols{grid-template-columns:280px minmax(0,1fr)}
  .col-out{display:none}
  .inline-out{display:block!important}
}
.inline-out{display:none;margin-top:8px}

/* Mobile */
@media (max-width:760px){
  body{font-size:15px}
  .shell{height:auto;min-height:100%}
  main.cols{flex:none}
  header.top{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .brand small{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .top-tools{margin-left:auto}
  main.cols{display:block}
  .col{overflow:visible}
  .col-list{border-right:0;background:var(--bg)}
  .col-detail{padding:16px 14px 140px;display:none}
  body.v-detail .col-list{display:none}
  body.v-detail .col-detail{display:block}
  .back{display:inline-flex;margin:0 0 12px -6px;border:0;background:none;color:var(--accent);font-weight:600;align-items:center;gap:4px;padding:6px}
  .d-head h1{font-size:23px}
  .rx{grid-template-columns:auto minmax(0,1fr);padding:14px}
  .rx-ctl{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin-top:6px}
  .blk-h{padding:12px 14px}
  .chk-list li{padding:9px 14px}
  .free{grid-template-columns:1fr;padding:12px 14px}
  .mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  body.v-detail .mbar.has{display:grid;grid-template-columns:1fr 1fr 1fr}
  .mbar .btn{height:46px;padding:0 8px;font-size:14px}
  .welcome{display:none}
  .list{padding:6px 10px 40px}
  .li{padding:12px 10px;font-size:15.5px;background:var(--surface);margin-bottom:4px;border-radius:12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="rx-mark" aria-hidden="true">℞</div><div><b>Alta PS</b><small>Receita e orientações para copiar e colar</small></div></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="sr">Buscar diagnóstico</label>
      <input id="q" type="search" autocomplete="off" placeholder="Buscar diagnóstico, sintoma ou CID">
      <kbd>/</kbd>
    </div>
    <div class="top-tools">
      <label class="switch" title="Saída em letras maiúsculas"><input type="checkbox" id="upper" checked>MAIÚSCULAS</label>
    </div>
  </header>
  <main class="cols">
    <nav class="col col-list" aria-label="Diagnósticos"><div class="list" id="list"></div></nav>
    <div class="col col-detail" id="detail"></div>
    <aside class="col col-out" id="out" aria-label="Texto para copiar"></aside>
  </main>
</div>
<div class="mbar" id="mbar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== Dados clínicos (baseados no roteiro de condutas do PS) =====
function M(n, f, v, p, u, d, o) { return Object.assign({ n, f, v, p, u: u || 0, d: d || 0 }, o || {}); }
const ALT = { alt: 1 };

// Itens recorrentes
const dip = (o) => M('Dipirona 500 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 6 em 6 horas, se dor ou febre.', 4, 5, Object.assign({ prn: 1 }, o));
const dip2 = (o) => M('Dipirona 500 mg', 'cp', 'ORAL', 'Tomar 2 comprimidos de 6 em 6 horas, se dor ou febre.', 8, 5, Object.assign({ prn: 1 }, o));
const parac750 = (o) => M('Paracetamol 750 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 6 em 6 horas, se dor ou febre. Não exceder 4 comprimidos ao dia.', 4, 5, Object.assign({ prn: 1 }, o));
const ibu12 = (o) => M('Ibuprofeno 600 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 12 em 12 horas, após as refeições, por {d} dias.', 2, 5, o);
const ibu8 = (o) => M('Ibuprofeno 600 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 8 em 8 horas, após as refeições, por {d} dias.', 3, 5, o);
const amox8 = (d, o) => M('Amoxicilina 500 mg', 'caps', 'ORAL', 'Tomar 1 cápsula de 8 em 8 horas por {d} dias.', 3, d, Object.assign({ atb: 1 }, o));
const amoxclav875 = (d, o) => M('Amoxicilina + clavulanato de potássio 875 + 125 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 12 em 12 horas, após as refeições, por {d} dias.', 2, d, Object.assign({ atb: 1 }, o));
const amoxclav500 = (d, o) => M('Amoxicilina + clavulanato de potássio 500 + 125 mg', 'cp', 'ORAL', 'Tomar 1 comprimido de 8 em 8 horas, após as refeições, por {d} dias.', 3, d, Object.assign({ atb: 1 }, o));
const azi = (d, o) => M('Azitromicina 500 mg', 'cp', 'ORAL', 'Tomar 1 comprimido 1 vez ao dia por {d} dias.', 1, d, Object.assign({ atb: 1 }, o));

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const store = {
  get(k, d){ try { const v = localStorage.getItem('altaps:' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('altaps:' + k, JSON.stringify(v)); } catch(e){} }
};
const SYSN = Object.fromEntries(SYS);
const BY = Object.fromEntries(CONDS.map(c => [c.id, c]));

const UNITS = { cp:['comprimido','comprimidos',0], caps:['cápsula','cápsulas',1], drg:['drágea','drágeas',1], env:['envelope','envelopes',0], fr:['frasco','frascos',0], tb:['tubo','tubos',0], amp:['ampola','ampolas',1], par:['par','pares',0] };
const SHORT = { cp:'cp', caps:'cáps', drg:'drg', env:'env', fr:'fr', tb:'tubo', amp:'amp', par:'par' };
const VIAS = ['ORAL','SUBLINGUAL','INALATÓRIA','NASAL','OFTÁLMICA','OTOLÓGICA','TÓPICA (OROFARINGE)','TÓPICA (BUCAL)','TÓPICA','RETAL','VAGINAL','INTRAMUSCULAR','USO EXTERNO'];
const VIAH = { 'ORAL':'Uso oral','SUBLINGUAL':'Uso sublingual','INALATÓRIA':'Uso inalatório','NASAL':'Uso nasal','OFTÁLMICA':'Uso oftálmico','OTOLÓGICA':'Uso otológico','TÓPICA (OROFARINGE)':'Uso tópico (orofaringe)','TÓPICA (BUCAL)':'Uso tópico (bucal)','TÓPICA':'Uso tópico','RETAL':'Uso retal','VAGINAL':'Uso vaginal','INTRAMUSCULAR':'Uso intramuscular','USO EXTERNO':'Uso externo' };
const VIASHORT = { 'ORAL':'Oral','SUBLINGUAL':'Sublingual','INALATÓRIA':'Inalatório','NASAL':'Nasal','OFTÁLMICA':'Oftálmico','OTOLÓGICA':'Otológico','TÓPICA (OROFARINGE)':'Orofaringe','TÓPICA (BUCAL)':'Bucal','TÓPICA':'Tópico','RETAL':'Retal','VAGINAL':'Vaginal','INTRAMUSCULAR':'IM','USO EXTERNO':'Externo' };

function extenso(n, fem){
  const u = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const t = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const h = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const f = w => fem ? w.replace(/^um$/,'uma').replace(/^dois$/,'duas').replace(/entos$/,'entas') : w;
  if (n === 100) return 'cem';
  if (n < 20) return f(u[n]);
  if (n < 100) return f(t[Math.floor(n/10)]) + (n%10 ? ' e ' + f(u[n%10]) : '');
  if (n < 1000){ const r = n % 100; return f(h[Math.floor(n/100)]) + (r ? ' e ' + extenso(r, fem) : ''); }
  return String(n);
}
function qtyText(n, f){ const U = UNITS[f] || ['unidade','unidades',1]; return n + ' (' + extenso(n, U[2]) + ') ' + (n === 1 ? U[0] : U[1]); }

/* ---------- State ---------- */
const S = {
  id: null, vi: 0, items: [], free: [], ori: [], alarm: [], extraOri: [], cidSel: 0, tab: 'receita',
  upper: store.get('upper', true), favs: store.get('favs', []), recent: store.get('recent', []), query: '', kb: -1
};
$('#upper').checked = S.upper;

function variant(c){ return c.variants ? c.variants[S.vi] || c.variants[0] : {}; }
function merged(c){
  const v = variant(c);
  return {
    casa: [].concat(v.casa || c.casa || [], c.casaComum || []),
    unid: v.unid || c.unid || [],
    ori: [].concat(v.ori || [], c.ori || []),
    alarm: [].concat(v.alarm || [], c.alarm || []),
    notes: [].concat(c.notes || [], v.notes || [])
  };
}
function initItems(){
  const c = BY[S.id]; if (!c || c.tpl) return;
  const m = merged(c);
  S.items = m.casa.map(it => ({ it, on: !it.alt, d: it.d, q: it.q != null ? it.q : Math.max(1, Math.ceil(it.u * it.d)) }));
  S.ori = m.ori.map(t => ({ t, on: true }));
  S.alarm = m.alarm.map(t => ({ t, on: true }));
}
function open(id, opts){
  if (!BY[id]) return;
  S.id = id; S.vi = 0; S.free = []; S.extraOri = []; S.cidSel = 0;
  const c = BY[id];
  const mm = merged(c); S.tab = c.tpl ? 'modelo' : c.unitOnly ? 'unidade' : mm.casa.length ? 'receita' : mm.ori.length ? 'ori' : 'unidade';
  initItems();
  S.recent = [id].concat(S.recent.filter(x => x !== id)).slice(0, 6); store.set('recent', S.recent);
  document.body.classList.add('v-detail');
  try { history.replaceState(null, '', '#' + id); } catch(e){}
  renderAll();
  if (!(opts && opts.keepScroll)) { $('#detail').scrollTop = 0; window.scrollTo(0, 0); }
}

/* ---------- Text builders ---------- */
const UP = s => S.upper ? s.toLocaleUpperCase('pt-BR') : s;
const W = 50;
function posText(e){ return e.it.p.replace(/\{d\} dias/g, e.d === 1 ? '1 dia' : e.d + ' dias').replace(/\{d\}/g, e.d); }
function lineFor(i, name, qty){
  const left = i + '. ' + name + ' ';
  const right = ' ' + qty;
  const dots = Math.max(3, W - left.length - right.length);
  return left + '.'.repeat(dots) + right;
}
function rxBlocks(){
  const on = S.items.filter(e => e.on).map(e => ({ name: e.it.n, v: e.it.v, qty: qtyText(e.q, e.it.f), pos: posText(e), ce: !!e.it.ce }))
    .concat(S.free.filter(f => f.on && f.name.trim()).map(f => ({ name: f.name, v: f.v, qty: f.qty || '', pos: f.pos || '', ce: false })));
  const groups = [ { title: 'Receita simples', items: on.filter(x => !x.ce) }, { title: 'Receita de controle especial', sub: 'Emitir em 2 vias (Portaria 344/98)', items: on.filter(x => x.ce) } ];
  return groups.filter(g => g.items.length).map(g => {
    let n = 0; const out = [];
    VIAS.concat(['__other']).forEach(v => {
      const its = g.items.filter(x => v === '__other' ? !VIAS.includes(x.v) : x.v === v);
      if (!its.length) return;
      if (out.length) out.push('');
      out.push(UP(VIAH[v] || ('Uso ' + v.toLowerCase())) + ':');
      out.push('');
      its.forEach(x => { n++; out.push(UP(lineFor(n, x.name, x.qty))); if (x.pos) out.push('   ' + UP(x.pos)); out.push(''); });
      out.pop();
    });
    return { title: g.title, sub: g.sub, text: out.join('\n') };
  });
}
function oriText(){
  const o = S.ori.filter(x => x.on).map(x => x.t).concat(S.extraOri);
  const a = S.alarm.filter(x => x.on).map(x => x.t);
  const out = [];
  if (o.length){ out.push(UP('Orientações:')); o.forEach(t => out.push('- ' + UP(t))); }
  if (a.length || o.length){
    if (out.length) out.push('');
    out.push(UP('Procurar o pronto-socorro imediatamente em caso de:'));
    a.forEach(t => out.push('- ' + UP(t)));
    out.push('- ' + UP('Piora ou persistência dos sintomas.'));
  }
  return out.join('\n');
}
function unidText(){
  const c = BY[S.id]; const m = merged(c);
  if (!m.unid.length) return '';
  return [UP('Prescrição na unidade:')].concat(m.unid.map((u, i) => (i + 1) + '. ' + UP(u))).join('\n');
}
function cdText(){

/* ---------- Clipboard ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600); }
async function copy(text, label, btn){
  if (!text){ toast('Nada selecionado para copiar'); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){} ta.remove();
  }
  toast(ok ? label : 'Não foi possível copiar: selecione o texto manualmente');
  if (ok && btn){ const h = btn.innerHTML; btn.classList.add('done'); btn.innerHTML = ICON.check + 'Copiado'; setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = h; }, 1300); }
}

/* ---------- Search / list ---------- */
function score(c, q){
  const t = norm(c.t), syn = norm(c.syn || ''), cids = (c.cid || []).map(x => norm(x[0])).join(' ');
  const words = q.split(/\s+/).filter(Boolean);
  let s = 0;
  for (const w of words){
    if (t.startsWith(w)) s += 6; else if (t.split(/[\s\/—-]+/).some(x => x.startsWith(w))) s += 4; else if (t.includes(w)) s += 3;
    else if (cids.split(' ').some(x => x.startsWith(w.replace(/\s/g, '')))) s += 5;
    else if (syn.split(' ').some(x => x.startsWith(w))) s += 2; else if (syn.includes(w)) s += 1;
    else return 0;
  }
  return s;
}
function results(){
  const q = norm(S.query.trim());
  if (!q) return null;
  return CONDS.map(c => [c, score(c, q)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || a[0].t.localeCompare(b[0].t)).map(x => x[0]);
}
function liHTML(c){
  const fav = S.favs.includes(c.id);
  return '<button class="li' + '" data-id="' + c.id + '"' + (S.id === c.id ? ' aria-current="true"' : '') + '>' + (fav ? '<span class="star" aria-label="favorito">★</span>' : '') + '<span>' + esc(c.t) + '</span>' + (c.cid && c.cid[0] ? '<span class="cid">' + esc(c.cid[0][0]) + '</span>' : '') + '</button>';

    if (!r.length) h += '<div class="empty-list">Tente o nome do sintoma, uma sigla (ITU, DPOC, HDA) ou o CID.</div>';

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  const li = t.closest('[data-id]'); if (li){ S.kb = -1; open(li.dataset.id); return; }
  const cp = t.closest('[data-copy]'); if (cp){ const [txt, lab] = textFor(cp.dataset.copy); copy(txt, lab, cp.classList.contains('btn') ? cp : null); return; }
  if (t.closest('[data-back]')){ document.body.classList.remove('v-detail'); window.scrollTo(0, 0); return; }
  if (t.closest('[data-fav]')){ S.favs = S.favs.includes(S.id) ? S.favs.filter(x => x !== S.id) : [S.id].concat(S.favs); store.set('favs', S.favs); renderList(); renderDetail(); renderOut(); return; }
  const vb = t.closest('[data-vi]'); if (vb){ S.vi = +vb.dataset.vi; S.free = S.free; initItems(); renderDetail(); renderOut(); return; }
  const cb = t.closest('[data-cid]'); if (cb){ S.cidSel = +cb.dataset.cid; const c = BY[S.id]; copy(c.cid[S.cidSel][0], 'CID copiado'); renderDetail(); renderOut(); return; }
  const tb = t.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; renderOut(); return; }
  const st = t.closest('.step button'); if (st){
    const box = st.closest('.step'); const e = S.items[+box.dataset.i]; const d = +st.dataset.d;
    if (box.dataset.step === 'd'){ e.d = Math.max(1, Math.min(90, e.d + d)); if (e.it.u) e.q = Math.max(1, Math.ceil(e.it.u * e.d)); }
    else e.q = Math.max(1, Math.min(999, e.q + d));
    e.on = true; refreshKeep(); return;
  }
  const fd = t.closest('[data-fdel]'); if (fd){ S.free.splice(+fd.dataset.fdel, 1); refreshKeep(); return; }
  if (t.closest('[data-fadd]')){ addFree(); return; }
  if (t.closest('[data-oadd]')){ addOri(); return; }
  const ft = t.closest('[data-ftog]'); if (ft){ const f = S.free[+ft.dataset.ftog]; f.on = !f.on; refreshKeep(); return; }
  const xo = t.closest('[data-xo]'); if (xo){ S.extraOri.splice(+xo.dataset.xo, 1); refreshKeep(); return; }
  const o = t.closest('[data-o]'); if (o){ ev.preventDefault(); const x = S.ori[+o.dataset.o]; x.on = !x.on; refreshKeep(); return; }
  const a = t.closest('[data-a]'); if (a){ ev.preventDefault(); const x = S.alarm[+a.dataset.a]; x.on = !x.on; refreshKeep(); return; }
  const row = t.closest('[data-row]'); if (row && !t.closest('.rx-ctl')){ ev.preventDefault(); const e = S.items[+row.dataset.row]; e.on = !e.on; refreshKeep(); return; }
});
function refreshKeep(){
  const d = $('#detail'); const st = d.scrollTop, ws = window.scrollY;

  d.scrollTop = st; window.scrollTo(0, ws);
}

$('#q').addEventListener('input', e => { S.query = e.target.value; S.kb = S.query ? 0 : -1; document.body.classList.remove('v-detail'); renderList(); });
$('#q').addEventListener('keydown', e => {

  else if (e.key === 'ArrowUp'){ e.preventDefault(); S.kb = Math.max(0, S.kb - 1); markKb(); }
  else if (e.key === 'Enter'){ const b = btns[Math.max(0, S.kb)]; if (b){ open(b.dataset.id); e.target.blur(); } }
  else if (e.key === 'Escape'){ e.target.value = ''; S.query = ''; S.kb = -1; renderList(); e.target.blur(); }
});
$('#upper').addEventListener('change', e => { S.upper = e.target.checked; store.set('upper', S.upper); renderOut(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Enter' && document.activeElement.id === 'oAdd'){ e.preventDefault(); addOri(); return; }
  if (e.key === 'Enter' && ['fName','fQty','fPos'].includes(document.activeElement.id)){ e.preventDefault(); addFree(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  const c = BY[S.id]; if (!c) return;
  const k = e.key.toLowerCase();
  if (k === 'r' && !c.tpl && !c.unitOnly){ const [t, l] = textFor('receita'); copy(t, l); }
  else if (k === 'o' && !c.tpl && !c.unitOnly){ const [t, l] = textFor('ori'); copy(t, l); }
  else if (k === 't' && !c.tpl && !c.unitOnly){ const [t, l] = textFor('tudo'); copy(t, l); }
});

const start = (location.hash || '').slice(1);
if (BY[start]) open(start); else renderAll();
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (BY[id] && id !== S.id) open(id); else if (!id){ S.id = null; document.body.classList.remove('v-detail'); renderAll(); } });
})();
</script>
</body>
